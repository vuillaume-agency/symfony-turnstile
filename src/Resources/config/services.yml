services:
  turnstile.type:
    class: VuillaumeAgency\TurnstileBundle\Type\TurnstileType
    tags: ['form.type']
    arguments:
      $key: '%vuillaume_agency_turnstile.key%'
      $enable: '%vuillaume_agency_turnstile.enable%'
      $disableSubmitUntilVerified: '%vuillaume_agency_turnstile.disable_submit_until_verified%'
  turnstile.validator:
    class: VuillaumeAgency\TurnstileBundle\Validator\CloudflareTurnstileValidator
    tags: ['validator.constraint_validator']
    arguments:
      $enable: '%vuillaume_agency_turnstile.enable%'
      $turnstileHttpClient: '@VuillaumeAgency\TurnstileBundle\Http\TurnstileHttpClientInterface'
    autowire: true
  turnstile.http_client:
    class: VuillaumeAgency\TurnstileBundle\Http\CloudflareTurnstileHttpClient
    arguments:
      $secret: '%vuillaume_agency_turnstile.secret%'
    autowire: true

  VuillaumeAgency\TurnstileBundle\Http\TurnstileHttpClientInterface:
    alias: turnstile.http_client

  turnstile.submit_extension:
    class: VuillaumeAgency\TurnstileBundle\Form\Extension\TurnstileSubmitExtension
    tags: ['form.type_extension']
    arguments:
      $enable: '%vuillaume_agency_turnstile.enable%'
      $disableSubmitUntilVerified: '%vuillaume_agency_turnstile.disable_submit_until_verified%'

  # turnstile_widget(): the widget in a plain HTML template (a login page, for instance), with
  # the same markup as the form field.
  turnstile.twig_extension:
    class: VuillaumeAgency\TurnstileBundle\Twig\TurnstileExtension
    tags: ['twig.extension']
    arguments:
      $key: '%vuillaume_agency_turnstile.key%'
      $enable: '%vuillaume_agency_turnstile.enable%'
