name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        symfony-version: ['7.4', '8.0']
        exclude:
          # Symfony 8.0 requires PHP >= 8.4
          - php-version: '8.2'
            symfony-version: '8.0'
          - php-version: '8.3'
            symfony-version: '8.0'

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-sf${{ matrix.symfony-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-sf${{ matrix.symfony-version }}-

    - name: Install dependencies with Symfony ${{ matrix.symfony-version }}
      run: |
        composer require --no-update symfony/form:^${{ matrix.symfony-version }} symfony/framework-bundle:^${{ matrix.symfony-version }} symfony/http-client:^${{ matrix.symfony-version }} symfony/yaml:^${{ matrix.symfony-version }} symfony/validator:^${{ matrix.symfony-version }} symfony/twig-bundle:^${{ matrix.symfony-version }}
        composer install --no-interaction --no-progress

    - name: Check for vulnerabilities
      uses: symfonycorp/security-checker-action@v5

    - name: Run PHP-CS-Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse

    - name: Run tests
      run: vendor/bin/phpunit -c tests/phpunit.xml.dist
