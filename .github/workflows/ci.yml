name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        # Every Symfony minor the bundle declares (composer.json: ^7.4|^8.0), each pinned to its own
        # minor with a tilde constraint below so a new minor cannot silently replace an older one.
        symfony-version: ['7.4', '8.0', '8.1']
        exclude:
          # Symfony 8.x requires PHP >= 8.4
          - php-version: '8.2'
            symfony-version: '8.0'
          - php-version: '8.3'
            symfony-version: '8.0'
          - php-version: '8.2'
            symfony-version: '8.1'
          - php-version: '8.3'
            symfony-version: '8.1'

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-sf${{ matrix.symfony-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-sf${{ matrix.symfony-version }}-

    - name: Install dependencies with Symfony ${{ matrix.symfony-version }}
      # Every Symfony component the test kernel loads is pinned to the matrix minor, not only the
      # ones composer.json requires: left free, http-kernel resolved to 8.1 next to framework-bundle
      # 7.4 and the "7.4" job was a mixed install whose 8.1 deprecations failed the zero-deprecation
      # policy without testing 7.4 at all.
      run: |
        WITH=()
        for pkg in form framework-bundle http-client yaml validator twig-bundle \
                   security-bundle security-http browser-kit \
                   http-kernel dependency-injection config http-foundation routing event-dispatcher \
                   security-core security-csrf password-hasher twig-bridge cache var-exporter \
                   filesystem finder error-handler options-resolver property-access property-info \
                   string mime var-dumper console; do
          WITH+=(--with "symfony/${pkg}:~${{ matrix.symfony-version }}.0")
        done
        composer update --prefer-stable --no-interaction --no-progress "${WITH[@]}"
        composer show 'symfony/*' | grep -vE 'contracts|polyfill|phpunit-bridge' | awk '{print $1, $2}'

    - name: Check for vulnerabilities
      uses: symfonycorp/security-checker-action@v5

    - name: Run PHP-CS-Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse

    - name: Run tests
      run: vendor/bin/phpunit -c tests/phpunit.xml.dist
